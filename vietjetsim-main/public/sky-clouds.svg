<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 2560" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Nền bầu trời với mây trắng và sắc tím hồng pastel">
  <defs>
    <!-- Trời sáng: xanh nhạt đỉnh -> tím hồng pastel -> hồng phấn chân trời -->
    <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#a9c7ea"/>
      <stop offset="0.35" stop-color="#c9d6f2"/>
      <stop offset="0.58" stop-color="#e6d7f1"/>
      <stop offset="0.8" stop-color="#f6e2ef"/>
      <stop offset="1" stop-color="#fdeff5"/>
    </linearGradient>
    <radialGradient id="glow-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f8d7ea" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#f8d7ea" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-purple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#d8c6f4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#d8c6f4" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-40%" y="-60%" width="180%" height="220%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
    <filter id="softer" x="-50%" y="-80%" width="200%" height="260%">
      <feGaussianBlur stdDeviation="22"/>
    </filter>
  </defs>

  <rect width="1920" height="2560" fill="url(#sky)"/>

  <!-- Vệt tím hồng pastel hòa vào trời -->
  <ellipse cx="420" cy="700" rx="520" ry="340" fill="url(#glow-purple)"/>
  <ellipse cx="1560" cy="1000" rx="560" ry="360" fill="url(#glow-pink)"/>
  <ellipse cx="900" cy="1900" rx="640" ry="380" fill="url(#glow-pink)"/>

  <!-- Các cụm mây trắng rõ nét, rải đều từ trên xuống dưới -->
  <g fill="#ffffff" filter="url(#soft)">
    <g opacity="0.95">
      <ellipse cx="400" cy="430" rx="150" ry="44"/>
      <ellipse cx="310" cy="446" rx="100" ry="36"/>
      <ellipse cx="500" cy="442" rx="115" ry="40"/>
      <ellipse cx="405" cy="398" rx="95" ry="44"/>
    </g>
    <g opacity="0.9">
      <ellipse cx="1460" cy="640" rx="170" ry="48"/>
      <ellipse cx="1350" cy="658" rx="110" ry="38"/>
      <ellipse cx="1580" cy="652" rx="120" ry="42"/>
      <ellipse cx="1470" cy="604" rx="100" ry="46"/>
    </g>
    <g opacity="0.9">
      <ellipse cx="880" cy="1080" rx="160" ry="46"/>
      <ellipse cx="770" cy="1096" rx="105" ry="36"/>
      <ellipse cx="990" cy="1092" rx="115" ry="40"/>
      <ellipse cx="885" cy="1046" rx="92" ry="42"/>
    </g>
    <g opacity="0.88">
      <ellipse cx="330" cy="1560" rx="155" ry="46"/>
      <ellipse cx="225" cy="1576" rx="100" ry="36"/>
      <ellipse cx="435" cy="1572" rx="110" ry="40"/>
      <ellipse cx="335" cy="1526" rx="90" ry="42"/>
    </g>
    <g opacity="0.9">
      <ellipse cx="1560" cy="1840" rx="170" ry="48"/>
      <ellipse cx="1450" cy="1858" rx="110" ry="38"/>
      <ellipse cx="1675" cy="1852" rx="120" ry="42"/>
      <ellipse cx="1565" cy="1804" rx="100" ry="46"/>
    </g>
    <g opacity="0.85">
      <ellipse cx="820" cy="2260" rx="150" ry="44"/>
      <ellipse cx="720" cy="2276" rx="95" ry="36"/>
      <ellipse cx="920" cy="2272" rx="105" ry="40"/>
      <ellipse cx="825" cy="2226" rx="88" ry="42"/>
    </g>
  </g>

  <!-- Mây xa nhỏ mờ phía sau -->
  <g fill="#ffffff" filter="url(#soft)" opacity="0.55">
    <ellipse cx="1180" cy="320" rx="90" ry="26"/>
    <ellipse cx="680" cy="820" rx="80" ry="24"/>
    <ellipse cx="1680" cy="1300" rx="95" ry="28"/>
    <ellipse cx="480" cy="1980" rx="85" ry="26"/>
    <ellipse cx="1300" cy="2450" rx="90" ry="26"/>
  </g>

  <!-- Dải mây chân trời ở đáy ảnh -->
  <g fill="#ffffff" filter="url(#softer)" opacity="0.85">
    <ellipse cx="200" cy="2520" rx="380" ry="110"/>
    <ellipse cx="720" cy="2560" rx="440" ry="120"/>
    <ellipse cx="1240" cy="2510" rx="400" ry="110"/>
    <ellipse cx="1720" cy="2560" rx="380" ry="110"/>
  </g>
</svg>
