name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

env:
  # Node 20 cannot run this suite: vitest@5 declares engines
  # "^22.12.0 || ^24.0.0 || >=26.0.0" and the app now pins @types/node ^26.
  # Keep this in step with SETUP.md ("Node.js v26.7.0 trở lên") — otherwise CI
  # fails before a single test runs.
  NODE_VERSION: '26'

jobs:
  lint-and-type-check:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run type-check

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint-and-type-check
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          CI: true

  smoke:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # Bound to 4028 so it matches the port the smoke test targets; without a
      # DATABASE_URL the app falls back to the in-memory mock, so no secrets are
      # needed. The smoke test polls until the server is ready itself.
      #
      # `set -m` gives the background job its own process group, so the trap can
      # kill the whole `npm -> next dev -> next-server` group. Killing only the
      # npm pid would leave next-server holding port 4028.
      - name: Smoke test against a running server
        run: |
          set -m
          npm run dev > /tmp/server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill -- -$SERVER_PID 2>/dev/null || true' EXIT
          npm run test:smoke
        env:
          JWT_SECRET: ci-smoke-test-secret
          JWT_REFRESH_SECRET: ci-smoke-test-refresh-secret

      - name: Upload server log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-server-log
          path: /tmp/server.log
          retention-days: 7

  summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint-and-type-check, test, build, smoke]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## CI Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| --- | --- |" >> $GITHUB_STEP_SUMMARY
          echo "| Lint & Type Check | ${{ needs.lint-and-type-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Smoke Test | ${{ needs.smoke.result }} |" >> $GITHUB_STEP_SUMMARY
